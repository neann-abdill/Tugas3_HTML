<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
</head>
<body>
    <h1>Create Account</h1>
     <h2>Detail Form</h2>

     <form action="">
                <label for="first-name">First name:</label>
                <br>
                <input type="text" id="first-name" name="first-name">
                <br>
                
                <label for="last-name">Last name:</label>
                <br>
                <input type="text" id="last-name" name="last-name">
                <br>

                 <label for="Username">Username:</label>
                <br>
                <input type="text" id="Username" name="Username">
                <br>

                <label for="Email">Email</label>
                <br>
                <input type="text" id="Email" name="Email">
                <br>

                <p>Gender:</p>
                <input type="radio" name="gender" id="Male" value="Male">
                <label for="Male">Male</label>
                <br>
                <input type="radio" name="gender" id="Female" value="Female">
                <label for="Female">Female</label>
                <br>
                <input type="radio" name="gender" id="Other" value="Other">
                <label for="Other">Other</label>
                <br>
                <br>

                <label for="Address">Address</label>
                <br>
                <input type="text" name="Address" id="Address">
                <br>     
                
                <label for="Address-2">Address 2</label>
                <br>
                <input type="text" name="Address-2" id="Address-2">
                <br>
                <h3>Nasionality:</h3>
                <p><label for="Nasionality">Nasionality</label></p>
                <select name="Nasionality" id="Nasionality">
                     <option value="Jawa">Jawa</option>
                <option value="Kalimantan">Kalimantan</option>
                <option value="Sumatra">Sumatra</option>
                <br>
                </select>

               

                <h4>Language spoken</h4>
                <input type="checkbox" name="Language" id="indonesia" value="indonesia">
                <label for="indonesia">Bahasa Indonesia</label>
                <br>
                <input type="checkbox" name="Language" id="English" value="English">
                <label for="English">English</label>
                <br>
                <input type="checkbox" name="Language" id="Other" value="Other">
                <label for="Other">Other</label>
                <br>

                <button>Create Account</button>



        </form>



</body>
</html>
