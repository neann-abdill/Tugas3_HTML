<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-80">
        <h2 class="text-2xl font-bold text-center mb-6 text-orange-500">Login</h2>
        <form id="loginForm">
            <!-- username -->
            <div class="mb-4 ">
                <label class="block text-gray-700">Username</label>
                <input type="text"
                 id="username" 
                 class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                 placeholder="Masukkan Username">
            </div>

            <!-- password -->
            <div class="mb-4">
                <label class="block text-gray-700">Password</label>
                <input type="password"
                 id="password"
                 class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                 placeholder="Masukkan Password">     
            </div>

            <!-- button -->
            <button type="submit"
            class="py-2 w-full bg-orange-500 text-white rounded-lg hover:bg-red-500">
            Login
        </button>

        </form>

        <!-- output -->
        <p id="message" class="text-center mt-4 text-sm"></p>

    </div>


    <script src="main.js"></script>
</body>

</html>
